[project]
name = "weather-proxy-cline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evgeny Titovets", email = "e.titovets@naveksoft.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
weather-proxy-cline = "weather_proxy_cline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
